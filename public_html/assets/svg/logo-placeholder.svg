<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="star-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="60" fill="none"/>
  <!-- Lettermark "A" -->
  <polygon points="20,40 30,12 40,40" fill="url(#brand-grad)" stroke="none"/>
  <line x1="23" y1="32" x2="37" y2="32" stroke="#0a0e27" stroke-width="2"/>
  <!-- Stars -->
  <circle cx="15" cy="15" r="1.2" fill="#fff" opacity="0.8"/>
  <circle cx="42" cy="10" r="0.8" fill="#fff" opacity="0.6"/>
  <circle cx="10" cy="30" r="0.6" fill="#fff" opacity="0.5"/>
  <circle cx="45" cy="25" r="1" fill="#fff" opacity="0.7"/>
  <!-- Orbit ring -->
  <ellipse cx="30" cy="26" rx="18" ry="6" fill="none" stroke="url(#brand-grad)" stroke-width="0.6" opacity="0.4" transform="rotate(-20 30 26)"/>
  <!-- Text -->
  <text x="55" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="url(#brand-grad)" letter-spacing="2">ASTROYDS</text>
</svg>
